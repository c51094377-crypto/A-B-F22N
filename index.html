<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB Camera Switcher</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
    input[type="file"] {
      margin-bottom: 8px;
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <input type="file" id="fileInput" accept=".glb" />
    <div>現在のカメラ: <strong id="camName">なし</strong></div>
    <div>[1] 操縦席 ⇄ 後部座席</div>
    <div>[￥] フリカメ（マウス操作有効）</div>
    <div>[C] キャノピー開閉</div>
    <div>[G] 脚・脚扉の収納 / 展開</div>
    <div>[V+2] 左-副WB扉 / [V+3] 右-副WB扉</div>
    <div>[V+4] 左-主WB扉 / [V+5] 右-主WB扉</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x222222);

    const defaultCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    defaultCamera.position.set(0, 2, 5);
    let activeCamera = defaultCamera;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(defaultCamera, renderer.domElement);
    controls.enableDamping = true;

    const ambientLight = new THREE.AmbientLight(0xffffff, 1.5);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffffff, 2);
    dirLight.position.set(5, 10, 7);
    scene.add(dirLight);

    const loader = new GLTFLoader();
    let loadedModel = null;
    const cameras = {};
    let seatIndex = 0;
    const seatNames = ['操縦席', '後部座席'];

    let isFreeLook = false;
    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;
    const freeLookEuler = new THREE.Euler(0, 0, 0, 'YXZ');

    const camNameEl = document.getElementById('camName');

    const nodes = {};
    const initialRotations = {};
    const animations = [];
    const pressedKeys = new Set();

    const state = {
      canopyClosed: false,
      leftSubWB: false,
      rightSubWB: false,
      leftMainWB: false,
      rightMainWB: false,
      gearRetracted: false
    };

    function getNode(name) {
      return nodes[name] || null;
    }

    function cancelAnimationsFor(obj) {
      for (let i = animations.length - 1; i >= 0; i--) {
        if (animations[i].obj === obj) {
          animations.splice(i, 1);
        }
      }
    }

    function animateRotation(obj, axis, targetVal, duration, onComplete = null) {
      if (!obj) return;
      cancelAnimationsFor(obj);
      animations.push({
        obj,
        axis,
        startVal: obj.rotation[axis],
        targetVal,
        duration,
        elapsed: 0,
        onComplete
      });
    }

    function animateRotationXYZ(obj, targetEuler, duration, onComplete = null) {
      if (!obj) return;
      cancelAnimationsFor(obj);
      animations.push({
        obj,
        isXYZ: true,
        startX: obj.rotation.x,
        startY: obj.rotation.y,
        startZ: obj.rotation.z,
        targetX: targetEuler.x,
        targetY: targetEuler.y,
        targetZ: targetEuler.z,
        duration,
        elapsed: 0,
        onComplete
      });
    }

    function toggleCanopy() {
      const obj = getNode('キャノピー');
      if (!obj) return;
      const initX = initialRotations['キャノピー'].x;
      state.canopyClosed = !state.canopyClosed;

      if (state.canopyClosed) {
        const deg10 = THREE.MathUtils.degToRad(10);
        const totalDiff = Math.abs(0 - initX);
        if (totalDiff > deg10) {
          const midX = initX > 0 ? deg10 : -deg10;
          const t1 = 5 * ((totalDiff - deg10) / totalDiff);
          animateRotation(obj, 'x', midX, t1, () => {
            animateRotation(obj, 'x', 0, 3);
          });
        } else {
          animateRotation(obj, 'x', 0, 3);
        }
      } else {
        animateRotation(obj, 'x', initX, 5);
      }
    }

    function toggleGear() {
      const gearNames = ['左-後脚収納', '右-後脚収納', '前脚収納A'];
      const doorNames = ['左-前脚扉A', '右-前脚扉A', '右-後脚扉A', '左-後脚扉A'];

      gearNames.forEach((name) => cancelAnimationsFor(getNode(name)));
      doorNames.forEach((name) => cancelAnimationsFor(getNode(name)));

      state.gearRetracted = !state.gearRetracted;

      if (state.gearRetracted) {
        const validGears = gearNames.filter((name) => getNode(name));
        const animateDoorsToZero = () => {
          doorNames.forEach((name) => {
            const obj = getNode(name);
            if (!obj) return;
            animateRotationXYZ(obj, { x: 0, y: 0, z: 0 }, 5);
          });
        };

        if (validGears.length === 0) {
          animateDoorsToZero();
        } else {
          let completed = 0;
          validGears.forEach((name) => {
            const obj = getNode(name);
            animateRotationXYZ(obj, { x: 0, y: 0, z: 0 }, 5, () => {
              completed++;
              if (completed === validGears.length) {
                animateDoorsToZero();
              }
            });
          });
        }
      } else {
        const validDoors = doorNames.filter((name) => getNode(name));
        const animateGearsToInit = () => {
          gearNames.forEach((name) => {
            const obj = getNode(name);
            if (!obj) return;
            const init = initialRotations[name];
            animateRotationXYZ(obj, { x: init.x, y: init.y, z: init.z }, 5);
          });
        };

        if (validDoors.length === 0) {
          animateGearsToInit();
        } else {
          let completed = 0;
          validDoors.forEach((name) => {
            const obj = getNode(name);
            const init = initialRotations[name];
            animateRotationXYZ(obj, { x: init.x, y: init.y, z: init.z }, 5, () => {
              completed++;
              if (completed === validDoors.length) {
                animateGearsToInit();
              }
            });
          });
        }
      }
    }

    function toggleDoorGroup(names, stateKey) {
      state[stateKey] = !state[stateKey];
      names.forEach((name) => {
        const obj = getNode(name);
        if (!obj) return;
        const targetZ = state[stateKey] ? 0 : initialRotations[name].z;
        animateRotation(obj, 'z', targetZ, 2);
      });
    }

    function switchCamera(name) {
      const target = cameras[name];
      if (!target) return;

      target.aspect = window.innerWidth / window.innerHeight;
      target.updateProjectionMatrix();
      activeCamera = target;
      camNameEl.textContent = name;

      controls.enabled = false;
      isFreeLook = true;
      freeLookEuler.setFromQuaternion(target.quaternion, 'YXZ');
    }

    function loadGLB(file) {
      const url = URL.createObjectURL(file);
      loader.load(url, (gltf) => {
        if (loadedModel) {
          scene.remove(loadedModel);
        }
        for (const key in cameras) {
          delete cameras[key];
        }
        for (const key in nodes) {
          delete nodes[key];
        }
        for (const key in initialRotations) {
          delete initialRotations[key];
        }
        animations.length = 0;
        state.canopyClosed = false;
        state.leftSubWB = false;
        state.rightSubWB = false;
        state.leftMainWB = false;
        state.rightMainWB = false;
        state.gearRetracted = false;

        loadedModel = gltf.scene;
        scene.add(loadedModel);

        loadedModel.traverse((obj) => {
          if (obj.name) {
            nodes[obj.name] = obj;
            initialRotations[obj.name] = obj.rotation.clone();
          }
          if (obj.isCamera && obj.name) {
            cameras[obj.name] = obj;
          }
        });

        if (gltf.cameras) {
          gltf.cameras.forEach((cam) => {
            if (cam.name && !cameras[cam.name]) {
              cameras[cam.name] = cam;
            }
          });
        }

        seatIndex = 0;
        if (cameras['操縦席']) {
          switchCamera('操縦席');
        } else if (cameras['後部座席']) {
          switchCamera('後部座席');
        } else if (cameras['フリカメ']) {
          switchCamera('フリカメ');
        } else {
          activeCamera = defaultCamera;
          controls.object = defaultCamera;
          controls.enabled = true;
          isFreeLook = false;
          camNameEl.textContent = 'デフォルト';
        }

        URL.revokeObjectURL(url);
      });
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadGLB(file);
    });

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (!isFreeLook) return;
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isFreeLook || !isDragging) return;
      const dx = e.clientX - prevMouseX;
      const dy = e.clientY - prevMouseY;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;

      const sensitivity = 0.003;
      freeLookEuler.y -= dx * sensitivity;
      freeLookEuler.x -= dy * sensitivity;
      freeLookEuler.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, freeLookEuler.x));
      activeCamera.quaternion.setFromEuler(freeLookEuler);
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    window.addEventListener('keydown', (e) => {
      pressedKeys.add(e.code);
      if (e.repeat) return;

      const isVHeld = pressedKeys.has('KeyV');

      if (isVHeld && (e.key === '2' || e.code === 'Digit2')) {
        toggleDoorGroup(['左-副WB扉A', '左-副WB扉B'], 'leftSubWB');
        return;
      }
      if (isVHeld && (e.key === '3' || e.code === 'Digit3')) {
        toggleDoorGroup(['右-副WB扉A', '右-副WB扉B'], 'rightSubWB');
        return;
      }
      if (isVHeld && (e.key === '4' || e.code === 'Digit4')) {
        toggleDoorGroup(['左-主WB扉A'], 'leftMainWB');
        return;
      }
      if (isVHeld && (e.key === '5' || e.code === 'Digit5')) {
        toggleDoorGroup(['右-主WB扉A'], 'rightMainWB');
        return;
      }

      if (e.code === 'KeyC') {
        toggleCanopy();
      } else if (e.code === 'KeyG') {
        toggleGear();
      } else if (e.key === '1' || e.code === 'Digit1') {
        const targetName = seatNames[seatIndex];
        if (cameras[targetName]) {
          switchCamera(targetName);
          seatIndex = (seatIndex + 1) % seatNames.length;
        } else {
          const altName = seatNames[(seatIndex + 1) % seatNames.length];
          if (cameras[altName]) {
            switchCamera(altName);
          }
        }
      } else if (e.key === '¥' || e.key === '\\' || e.code === 'IntlYen' || e.code === 'Backslash') {
        switchCamera('フリカメ');
      }
    });

    window.addEventListener('keyup', (e) => {
      pressedKeys.delete(e.code);
    });

    window.addEventListener('blur', () => {
      pressedKeys.clear();
    });

    window.addEventListener('resize', () => {
      activeCamera.aspect = window.innerWidth / window.innerHeight;
      activeCamera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = clock.getDelta();

      for (let i = animations.length - 1; i >= 0; i--) {
        const anim = animations[i];
        anim.elapsed += dt;
        const progress = anim.duration > 0 ? Math.min(anim.elapsed / anim.duration, 1) : 1;

        if (anim.isXYZ) {
          anim.obj.rotation.x = anim.startX + (anim.targetX - anim.startX) * progress;
          anim.obj.rotation.y = anim.startY + (anim.targetY - anim.startY) * progress;
          anim.obj.rotation.z = anim.startZ + (anim.targetZ - anim.startZ) * progress;
        } else {
          anim.obj.rotation[anim.axis] = anim.startVal + (anim.targetVal - anim.startVal) * progress;
        }

        if (progress >= 1) {
          animations.splice(i, 1);
          if (anim.onComplete) {
            anim.onComplete();
          }
        }
      }

      if (controls.enabled) {
        controls.update();
      }
      renderer.render(scene, activeCamera);
    }
    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB Camera Switcher</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
    input[type="file"] {
      margin-bottom: 8px;
      display: block;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <input type="file" id="fileInput" accept=".glb" />
    <div>現在のカメラ: <strong id="camName">なし</strong></div>
    <div>[1] 射手 ⇄ 車長</div>
    <div>[2] ガンナー ⇄ 運転席 ⇄ 助手席</div>
    <div>[￥] フリカメ（WASD歩行・Spaceジャンプ・マウス操作）</div>
    <div>[Q/E] 銃座旋回（慣性付き）</div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Sky } from 'three/addons/objects/Sky.js';

    const scene = new THREE.Scene();

    const sky = new Sky();
    sky.scale.setScalar(450000);
    scene.add(sky);

    const sun = new THREE.Vector3();
    const phi = THREE.MathUtils.degToRad(88);
    const theta = THREE.MathUtils.degToRad(180);
    sun.setFromSphericalCoords(1, phi, theta);
    sky.material.uniforms['sunPosition'].value.copy(sun);

    const defaultCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    defaultCamera.position.set(0, 2, 5);
    let activeCamera = defaultCamera;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const skyEnvScene = new THREE.Scene();
    const envSky = new Sky();
    envSky.scale.setScalar(10000);
    envSky.material.uniforms['turbidity'].value = 4;
    envSky.material.uniforms['rayleigh'].value = 2;
    envSky.material.uniforms['mieCoefficient'].value = 0.005;
    envSky.material.uniforms['mieDirectionalG'].value = 0.8;
    envSky.material.uniforms['sunPosition'].value.copy(sun);
    skyEnvScene.add(envSky);
    const envRT = pmremGenerator.fromScene(skyEnvScene, 0.04);
    scene.environment = envRT.texture;
    scene.environmentIntensity = 1.0;

    sky.material.uniforms['turbidity'].value = 4;
    sky.material.uniforms['rayleigh'].value = 2;
    sky.material.uniforms['mieCoefficient'].value = 0.005;
    sky.material.uniforms['mieDirectionalG'].value = 0.8;

    const controls = new OrbitControls(defaultCamera, renderer.domElement);
    controls.enableDamping = true;

    const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x3b352e, 0.65);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff1dc, 2.2);
    dirLight.position.copy(sun).multiplyScalar(100);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 300;
    dirLight.shadow.camera.left = -30;
    dirLight.shadow.camera.right = 30;
    dirLight.shadow.camera.top = 30;
    dirLight.shadow.camera.bottom = -30;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const loader = new GLTFLoader();
    let loadedModel = null;
    const cameras = {};
    let seatIndex = 0;
    const seatNames = ['射手', '車長'];

    let group2Index = 0;
    const group2Names = ['ガンナー', '運転席', '助手席'];

    let isFreeLook = false;
    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;
    const freeLookEuler = new THREE.Euler(0, 0, 0, 'YXZ');

    const camNameEl = document.getElementById('camName');

    const nodes = {};
    const initialRotations = {};
    const pressedKeys = new Set();
    let turretVelocity = 0;

    const raycaster = new THREE.Raycaster();
    const downDir = new THREE.Vector3(0, -1, 0);
    let baseMeshes = [];
    const physicsEntities = [];

    function getNode(name) {
      return nodes[name] || null;
    }

    function setupPhysics() {
      baseMeshes = [];
      physicsEntities.length = 0;
      if (!loadedModel) return;

      const baseGroup = getNode('基地');
      if (baseGroup) {
        baseGroup.traverse((child) => {
          if (child.isMesh) {
            baseMeshes.push(child);
          }
        });
      }

      const targets = [
        { obj: cameras['フリカメ'], laserLength: 18.405, isFrikame: true },
        { obj: getNode('8輪装輪装甲車'), laserLength: 0, isFrikame: false },
        { obj: getNode('HMMWV'), laserLength: 0, isFrikame: false }
      ];

      loadedModel.children.forEach((child) => {
        if (child.name === '基地') return;
        if (child === cameras['フリカメ'] || child === getNode('8輪装輪装甲車') || child === getNode('HMMWV')) return;
        if (child.isCamera && child.name !== 'フリカメ') return;
        let containsSeatCamera = false;
        child.traverse((sub) => {
          if (sub.isCamera && sub.name !== 'フリカメ') {
            containsSeatCamera = true;
          }
        });
        if (!containsSeatCamera) {
          targets.push({ obj: child, laserLength: 0, isFrikame: false });
        }
      });

      targets.forEach((t) => {
        if (!t.obj) return;
        physicsEntities.push({
          obj: t.obj,
          laserLength: t.laserLength,
          isFrikame: t.isFrikame,
          vy: 0,
          onGround: false
        });
      });
    }

    function updatePhysics(dt) {
      if (physicsEntities.length === 0) return;

      const gravity = -9.8;
      const walkSpeed = 6.0;
      const jumpSpeed = 5.5;
      const worldPos = new THREE.Vector3();
      const rayOrigin = new THREE.Vector3();
      const forward = new THREE.Vector3();
      const right = new THREE.Vector3();
      const moveDir = new THREE.Vector3();

      loadedModel.updateMatrixWorld(true);

      physicsEntities.forEach((entity) => {
        const obj = entity.obj;

        if (entity.isFrikame && activeCamera === obj) {
          forward.set(0, 0, -1).applyQuaternion(obj.quaternion);
          forward.y = 0;
          if (forward.lengthSq() > 0) forward.normalize();

          right.set(1, 0, 0).applyQuaternion(obj.quaternion);
          right.y = 0;
          if (right.lengthSq() > 0) right.normalize();

          moveDir.set(0, 0, 0);
          if (pressedKeys.has('KeyW')) moveDir.add(forward);
          if (pressedKeys.has('KeyS')) moveDir.sub(forward);
          if (pressedKeys.has('KeyD')) moveDir.add(right);
          if (pressedKeys.has('KeyA')) moveDir.sub(right);

          if (moveDir.lengthSq() > 0) {
            moveDir.normalize().multiplyScalar(walkSpeed * dt);
            if (obj.parent) {
              const parentScale = new THREE.Vector3();
              obj.parent.getWorldScale(parentScale);
              const invQuat = obj.parent.getWorldQuaternion(new THREE.Quaternion()).invert();
              moveDir.applyQuaternion(invQuat);
              obj.position.x += moveDir.x / (parentScale.x || 1);
              obj.position.z += moveDir.z / (parentScale.z || 1);
            } else {
              obj.position.add(moveDir);
            }
          }

          if (pressedKeys.has('Space') && entity.onGround) {
            entity.vy = jumpSpeed;
            entity.onGround = false;
          }
        }

        entity.vy += gravity * dt;
        const dyWorld = entity.vy * dt;

        obj.updateMatrixWorld(true);
        obj.getWorldPosition(worldPos);

        const rayOffsetUp = 0.5;
        rayOrigin.copy(worldPos);
        rayOrigin.y += rayOffsetUp;

        const maxDist = rayOffsetUp + entity.laserLength + Math.max(0, -dyWorld) + 0.05;
        raycaster.set(rayOrigin, downDir);
        raycaster.near = 0;
        raycaster.far = maxDist;

        let hitY = null;
        if (baseMeshes.length > 0) {
          const intersects = raycaster.intersectObjects(baseMeshes, false);
          if (intersects.length > 0) {
            hitY = intersects[0].point.y;
          }
        }

        const nextWorldY = worldPos.y + dyWorld;
        const targetFloorWorldY = hitY !== null ? hitY + entity.laserLength : null;

        if (targetFloorWorldY !== null && nextWorldY <= targetFloorWorldY && entity.vy <= 0) {
          const correctionWorldY = targetFloorWorldY - worldPos.y;
          if (obj.parent) {
            const parentScale = new THREE.Vector3();
            obj.parent.getWorldScale(parentScale);
            obj.position.y += correctionWorldY / (parentScale.y || 1);
          } else {
            obj.position.y += correctionWorldY;
          }
          entity.vy = 0;
          entity.onGround = true;
        } else {
          if (obj.parent) {
            const parentScale = new THREE.Vector3();
            obj.parent.getWorldScale(parentScale);
            obj.position.y += dyWorld / (parentScale.y || 1);
          } else {
            obj.position.y += dyWorld;
          }
          entity.onGround = false;
        }
      });
    }

    function switchCamera(name) {
      const target = cameras[name];
      if (!target) return;

      target.near = 0.01;
      target.updateProjectionMatrix();

      target.aspect = window.innerWidth / window.innerHeight;
      target.updateProjectionMatrix();
      activeCamera = target;
      camNameEl.textContent = name;

      controls.enabled = false;
      isFreeLook = true;
      freeLookEuler.setFromQuaternion(target.quaternion, 'YXZ');
    }

    function loadGLB(file) {
      const url = URL.createObjectURL(file);
      loader.load(url, (gltf) => {
        if (loadedModel) {
          scene.remove(loadedModel);
        }
        for (const key in cameras) {
          delete cameras[key];
        }
        for (const key in nodes) {
          delete nodes[key];
        }
        for (const key in initialRotations) {
          delete initialRotations[key];
        }
        turretVelocity = 0;

        loadedModel = gltf.scene;
        scene.add(loadedModel);

        loadedModel.traverse((obj) => {
          if (obj.isMesh) {
            obj.castShadow = true;
            obj.receiveShadow = true;
            if (obj.material) {
              obj.material.envMapIntensity = 1.0;
              obj.material.needsUpdate = true;
            }
          }
          if (obj.name) {
            nodes[obj.name] = obj;
            initialRotations[obj.name] = obj.rotation.clone();
          }
          if (obj.isCamera && obj.name) {
            obj.near = 0.01;
            obj.updateProjectionMatrix();
            cameras[obj.name] = obj;
          }
        });

        if (gltf.cameras) {
          gltf.cameras.forEach((cam) => {
            cam.near = 0.01;
            cam.updateProjectionMatrix();
            if (cam.name && !cameras[cam.name]) {
              cameras[cam.name] = cam;
            }
          });
        }

        setupPhysics();

        seatIndex = 0;
        group2Index = 0;
        if (cameras['射手']) {
          switchCamera('射手');
        } else if (cameras['車長']) {
          switchCamera('車長');
        } else if (cameras['フリカメ']) {
          switchCamera('フリカメ');
        } else {
          activeCamera = defaultCamera;
          defaultCamera.near = 0.01;
          defaultCamera.updateProjectionMatrix();
          controls.object = defaultCamera;
          controls.enabled = true;
          isFreeLook = false;
          camNameEl.textContent = 'デフォルト';
        }

        URL.revokeObjectURL(url);
      });
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadGLB(file);
    });

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (!isFreeLook) return;
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isFreeLook || !isDragging) return;
      const dx = e.clientX - prevMouseX;
      const dy = e.clientY - prevMouseY;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;

      const sensitivity = 0.003;
      freeLookEuler.y -= dx * sensitivity;
      freeLookEuler.x -= dy * sensitivity;
      freeLookEuler.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, freeLookEuler.x));
      activeCamera.quaternion.setFromEuler(freeLookEuler);
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    window.addEventListener('keydown', (e) => {
      pressedKeys.add(e.code);
      if (e.repeat) return;

      if (e.key === '1' || e.code === 'Digit1') {
        const targetName = seatNames[seatIndex];
        if (cameras[targetName]) {
          switchCamera(targetName);
          seatIndex = (seatIndex + 1) % seatNames.length;
        } else {
          const altName = seatNames[(seatIndex + 1) % seatNames.length];
          if (cameras[altName]) {
            switchCamera(altName);
          }
        }
      } else if (e.key === '2' || e.code === 'Digit2') {
        const targetName = group2Names[group2Index];
        if (cameras[targetName]) {
          switchCamera(targetName);
          group2Index = (group2Index + 1) % group2Names.length;
        } else {
          const altName = group2Names[(group2Index + 1) % group2Names.length];
          if (cameras[altName]) {
            switchCamera(altName);
          }
        }
      } else if (e.key === '¥' || e.key === '\\' || e.code === 'IntlYen' || e.code === 'Backslash') {
        switchCamera('フリカメ');
      }
    });

    window.addEventListener('keyup', (e) => {
      pressedKeys.delete(e.code);
    });

    window.addEventListener('blur', () => {
      pressedKeys.clear();
    });

    window.addEventListener('resize', () => {
      activeCamera.aspect = window.innerWidth / window.innerHeight;
      activeCamera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      updatePhysics(dt);

      const turret = getNode('銃座');
      if (turret) {
        const initY = initialRotations['銃座'] ? initialRotations['銃座'].y : 0;
        let inputDir = 0;
        if (pressedKeys.has('KeyQ')) inputDir += 1;
        if (pressedKeys.has('KeyE')) inputDir -= 1;

        const acceleration = 5.0;
        const damping = 3.0;

        turretVelocity += inputDir * acceleration * dt;
        turretVelocity -= turretVelocity * damping * dt;
        turret.rotation.y += turretVelocity * dt;
      }

      if (controls.enabled) {
        controls.update();
      }
      renderer.render(scene, activeCamera);
    }
    animate();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GLB Camera Switcher</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: #111;
      color: #fff;
      font-family: sans-serif;
    }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(0, 0, 0, 0.7);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      line-height: 1.6;
    }
    input[type="file"] {
      margin-bottom: 8px;
      display: block;
    }
    #manualUI {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 10;
      background: linear-gradient(145deg, #2b2b2b, #141414);
      padding: 16px 20px;
      border-radius: 24px;
      font-size: 14px;
      display: none;
      border: 3px solid #555;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8), inset 0 2px 6px rgba(255,255,255,0.15);
      width: 210px;
      user-select: none;
    }
    .speed-display {
      text-align: center;
      margin-bottom: 10px;
      font-weight: bold;
      font-size: 13px;
      color: #ccc;
      letter-spacing: 1px;
    }
    .shift-plate {
      position: relative;
      width: 180px;
      height: 130px;
      margin: 0 auto;
      background: radial-gradient(circle at 30% 30%, #4a4a4a, #222222);
      border-radius: 16px;
      border: 2px solid #777;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.8), 0 2px 4px rgba(255,255,255,0.1);
    }
    .shift-svg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .gear-label {
      position: absolute;
      width: 26px;
      height: 26px;
      line-height: 24px;
      text-align: center;
      font-weight: 900;
      font-size: 15px;
      color: #bbb;
      border-radius: 6px;
      border: 2px solid transparent;
      transform: translate(-50%, -50%);
      transition: all 0.12s ease;
    }
    .gear-label.active {
      border-color: #ff3333;
      box-shadow: 0 0 10px #ff3333, inset 0 0 6px rgba(255, 51, 51, 0.5);
      color: #ff3333;
      background: rgba(255, 30, 30, 0.15);
    }
    .neutral-indicator {
      position: absolute;
      top: 65px;
      left: 90px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #444;
      border: 2px solid #777;
      transform: translate(-50%, -50%);
      transition: all 0.12s ease;
    }
    .neutral-indicator.active {
      background: #ff3333;
      border-color: #ff3333;
      box-shadow: 0 0 10px #ff3333;
    }
    .shift-knob {
      position: absolute;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ff6666, #cc0000);
      border: 2px solid #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.8);
      transform: translate(-50%, -50%);
      transition: top 0.12s ease, left 0.12s ease;
      pointer-events: none;
      z-index: 5;
    }
    .tacho-container {
      margin-top: 14px;
      text-align: center;
      background: #181818;
      border-radius: 50%;
      width: 150px;
      height: 150px;
      margin-left: auto;
      margin-right: auto;
      position: relative;
      border: 4px solid #333;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.9), 0 2px 6px rgba(0,0,0,0.5);
    }
    .tacho-dial {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
    }
    .tacho-needle {
      position: absolute;
      bottom: 50%;
      left: 50%;
      width: 4px;
      height: 52px;
      background: linear-gradient(to top, #fff, #ffdd44);
      border-radius: 2px;
      transform-origin: bottom center;
      transform: translateX(-50%) rotate(-135deg);
      transition: transform 0.05s linear;
      box-shadow: 0 0 4px rgba(0,0,0,0.8);
      z-index: 3;
    }
    .tacho-cap {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      background: #222;
      border: 2px solid #aaa;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
    }
    .tacho-label {
      position: absolute;
      font-size: 11px;
      font-weight: bold;
      color: #ddd;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="ui">
    <input type="file" id="fileInput" accept=".glb" />
    <div>現在のカメラ: <strong id="camName">なし</strong></div>
    <div>[1] 射手 ⇄ 車長 ⇄ 操縦手</div>
    <div>[2] ガンナー ⇄ 運転席 ⇄ 助手席</div>
    <div>[￥] フリカメ（WASD歩行・Spaceジャンプ・マウス操作）</div>
    <div>[Q/E] 銃座旋回（慣性付き）</div>
    <div>[HKUJ] シフトレバー / [W] アクセル / [S] ブレーキ</div>
  </div>

  <div id="manualUI">
    <div class="speed-display"><span id="carSpeed">0</span> km/h</div>
    <div class="shift-plate">
      <svg class="shift-svg" viewBox="0 0 180 130">
        <line x1="22" y1="65" x2="158" y2="65" stroke="#888" stroke-width="4" stroke-linecap="round" />
        <line x1="22" y1="65" x2="22" y2="92" stroke="#888" stroke-width="4" stroke-linecap="round" />
        <line x1="56" y1="38" x2="56" y2="92" stroke="#888" stroke-width="4" stroke-linecap="round" />
        <line x1="90" y1="38" x2="90" y2="92" stroke="#888" stroke-width="4" stroke-linecap="round" />
        <line x1="124" y1="38" x2="124" y2="92" stroke="#888" stroke-width="4" stroke-linecap="round" />
        <line x1="158" y1="38" x2="158" y2="92" stroke="#888" stroke-width="4" stroke-linecap="round" />
      </svg>

      <div id="box1" class="gear-label" style="top: 20px; left: 56px;">1</div>
      <div id="box3" class="gear-label" style="top: 20px; left: 90px;">3</div>
      <div id="box5" class="gear-label" style="top: 20px; left: 124px;">5</div>
      <div id="box7" class="gear-label" style="top: 20px; left: 158px;">7</div>

      <div id="boxN" class="neutral-indicator active"></div>

      <div id="boxR" class="gear-label" style="top: 110px; left: 22px;">R</div>
      <div id="box2" class="gear-label" style="top: 110px; left: 56px;">2</div>
      <div id="box4" class="gear-label" style="top: 110px; left: 90px;">4</div>
      <div id="box6" class="gear-label" style="top: 110px; left: 124px;">6</div>
      <div id="box8" class="gear-label" style="top: 110px; left: 158px;">8</div>

      <div id="shiftKnob" class="shift-knob" style="top: 65px; left: 90px;"></div>
    </div>
    <div class="tacho-container">
      <svg class="tacho-dial" viewBox="0 0 150 150">
        <!-- レッドゾーン (6〜8) -->
        <path d="M 112 112 A 55 55 0 0 0 132 75 A 55 55 0 0 0 112 38" fill="none" stroke="#cc2222" stroke-width="6" stroke-linecap="round" />
        <!-- 目盛りと数字 (0〜8) -->
        <text x="32" y="112" class="tacho-label" text-anchor="middle">0</text>
        <text x="22" y="78" class="tacho-label" text-anchor="middle">1</text>
        <text x="38" y="45" class="tacho-label" text-anchor="middle">2</text>
        <text x="75" y="28" class="tacho-label" text-anchor="middle">4</text>
        <text x="112" y="45" class="tacho-label" text-anchor="middle">6</text>
        <text x="128" y="78" class="tacho-label" text-anchor="middle">7</text>
        <text x="118" y="112" class="tacho-label" text-anchor="middle">8</text>
        <text x="75" y="122" class="tacho-label" text-anchor="middle" font-size="8" fill="#aaa">x1000r/min</text>
      </svg>
      <div id="tachoNeedle" class="tacho-needle"></div>
      <div class="tacho-cap"></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { Sky } from 'three/addons/objects/Sky.js';

    const scene = new THREE.Scene();

    const sky = new Sky();
    sky.scale.setScalar(450000);
    scene.add(sky);

    const sun = new THREE.Vector3();
    const phi = THREE.MathUtils.degToRad(88);
    const theta = THREE.MathUtils.degToRad(180);
    sun.setFromSphericalCoords(1, phi, theta);
    sky.material.uniforms['sunPosition'].value.copy(sun);

    const defaultCamera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    defaultCamera.position.set(0, 2, 5);
    let activeCamera = defaultCamera;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    renderer.shadowMap.autoUpdate = false;
    document.body.appendChild(renderer.domElement);

    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    const skyEnvScene = new THREE.Scene();
    const envSky = new Sky();
    envSky.scale.setScalar(10000);
    envSky.material.uniforms['turbidity'].value = 4;
    envSky.material.uniforms['rayleigh'].value = 2;
    envSky.material.uniforms['mieCoefficient'].value = 0.005;
    envSky.material.uniforms['mieDirectionalG'].value = 0.8;
    envSky.material.uniforms['sunPosition'].value.copy(sun);
    skyEnvScene.add(envSky);
    const envRT = pmremGenerator.fromScene(skyEnvScene, 0.04);
    scene.environment = envRT.texture;
    scene.environmentIntensity = 1.0;
    pmremGenerator.dispose();

    sky.material.uniforms['turbidity'].value = 4;
    sky.material.uniforms['rayleigh'].value = 2;
    sky.material.uniforms['mieCoefficient'].value = 0.005;
    sky.material.uniforms['mieDirectionalG'].value = 0.8;

    const controls = new OrbitControls(defaultCamera, renderer.domElement);
    controls.enableDamping = true;

    const hemiLight = new THREE.HemisphereLight(0xddeeff, 0x3b352e, 0.65);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfff1dc, 2.2);
    dirLight.position.copy(sun).multiplyScalar(100);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 1024;
    dirLight.shadow.mapSize.height = 1024;
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 300;
    dirLight.shadow.camera.left = -30;
    dirLight.shadow.camera.right = 30;
    dirLight.shadow.camera.top = 30;
    dirLight.shadow.camera.bottom = -30;
    dirLight.shadow.bias = -0.0005;
    scene.add(dirLight);

    const loader = new GLTFLoader();
    let loadedModel = null;
    const cameras = {};
    let seatIndex = 0;
    const seatNames = ['射手', '車長', '操縦手'];

    let group2Index = 0;
    const group2Names = ['ガンナー', '運転席', '助手席'];

    let isFreeLook = false;
    let isDragging = false;
    let prevMouseX = 0;
    let prevMouseY = 0;
    const freeLookEuler = new THREE.Euler(0, 0, 0, 'YXZ');

    const camNameEl = document.getElementById('camName');
    const manualUIEl = document.getElementById('manualUI');
    const carSpeedEl = document.getElementById('carSpeed');
    const shiftKnobEl = document.getElementById('shiftKnob');
    const tachoNeedleEl = document.getElementById('tachoNeedle');

    const nodes = {};
    const initialRotations = {};
    const pressedKeys = new Set();
    let turretVelocity = 0;
    let steerAngle = 0;

    let shiftCol = 2;
    let shiftRow = 0;
    let currentGear = 'N'; 
    let carSpeed = 0; 
    let engineRpm = 800;
    let wheelRotationZ = 0;
    let highestGearStarted = 1;

    const raycaster = new THREE.Raycaster();
    raycaster.firstHitOnly = true;
    const downDir = new THREE.Vector3(0, -1, 0);
    let allSceneMeshes = [];
    const physicsEntities = [];

    const _worldPos = new THREE.Vector3();
    const _rayOrigin = new THREE.Vector3();
    const _forward = new THREE.Vector3();
    const _right = new THREE.Vector3();
    const _moveDir = new THREE.Vector3();
    const _moveStepWorld = new THREE.Vector3();
    const _horizDir = new THREE.Vector3();
    const _finalMoveWorld = new THREE.Vector3();
    const _parentScale = new THREE.Vector3();
    const _parentQuat = new THREE.Quaternion();
    const _meshBox = new THREE.Box3();
    const _rayBox = new THREE.Box3();

    function getNode(name) {
      return nodes[name] || null;
    }

    function updateGearFromPosition() {
      if (shiftRow === 0) {
        currentGear = 'N';
      } else if (shiftRow === -1) {
        if (shiftCol === 1) currentGear = '1';
        else if (shiftCol === 2) currentGear = '3';
        else if (shiftCol === 3) currentGear = '5';
        else if (shiftCol === 4) currentGear = '7';
      } else if (shiftRow === 1) {
        if (shiftCol === 0) currentGear = 'R';
        else if (shiftCol === 1) currentGear = '2';
        else if (shiftCol === 2) currentGear = '4';
        else if (shiftCol === 3) currentGear = '6';
        else if (shiftCol === 4) currentGear = '8';
      }
      if (currentGear >= '1' && currentGear <= '8') {
        const gNum = parseInt(currentGear);
        if (gNum > highestGearStarted) {
          highestGearStarted = gNum;
        }
      } else if (currentGear === 'N' || currentGear === 'R') {
        highestGearStarted = 1;
      }
    }

    function updateManualUI() {
      const isControlCamera =
        activeCamera === cameras['射手'] ||
        activeCamera === cameras['車長'] ||
        activeCamera === cameras['操縦手'];

      if (isControlCamera) {
        manualUIEl.style.display = 'block';
        carSpeedEl.textContent = Math.round(carSpeed);

        // タコメーター針の角度計算 (0 RPM = -135deg, 8000 RPM = +135degあたり)
        let angleDeg = -135 + (engineRpm / 8000) * 270;
        tachoNeedleEl.style.transform = `translateX(-50%) rotate(${angleDeg}deg)`;

        const colX = [22, 56, 90, 124, 158];
        const rowY = shiftRow === -1 ? 38 : (shiftRow === 1 ? 92 : 65);
        shiftKnobEl.style.left = colX[shiftCol] + 'px';
        shiftKnobEl.style.top = rowY + 'px';

        const boxes = ['R', 'N', '1', '2', '3', '4', '5', '6', '7', '8'];
        boxes.forEach((b) => {
          const el = document.getElementById('box' + b);
          if (el) {
            if (b === currentGear) {
              el.classList.add('active');
            } else {
              el.classList.remove('active');
            }
          }
        });
      } else {
        manualUIEl.style.display = 'none';
      }
    }

    function setupPhysics() {
      allSceneMeshes = [];
      physicsEntities.length = 0;
      if (!loadedModel) return;

      loadedModel.updateMatrixWorld(true);

      loadedModel.traverse((child) => {
        if (child.isMesh) {
          if (!child.geometry.boundingBox) {
            child.geometry.computeBoundingBox();
          }
          if (!child.geometry.boundingSphere) {
            child.geometry.computeBoundingSphere();
          }
          const worldBox = child.geometry.boundingBox.clone().applyMatrix4(child.matrixWorld);
          child.userData.worldBox = worldBox;
          allSceneMeshes.push(child);
        }
      });

      const targets = [
        { obj: cameras['フリカメ'], laserLength: 11.68, isFrikame: true },
        { obj: getNode('8輪装輪装甲車'), laserLength: 0, isFrikame: false },
        { obj: getNode('HMMWV'), laserLength: 0, isFrikame: false }
      ];

      loadedModel.children.forEach((child) => {
        if (child.name === '基地') return;
        if (child === cameras['フリカメ'] || child === getNode('8輪装輪装甲車') || child === getNode('HMMWV')) return;
        if (child.isCamera && child.name !== 'フリカメ') return;
        let containsSeatCamera = false;
        child.traverse((sub) => {
          if (sub.isCamera && sub.name !== 'フリカメ') {
            containsSeatCamera = true;
          }
        });
        if (!containsSeatCamera) {
          targets.push({ obj: child, laserLength: 0, isFrikame: false });
        }
      });

      targets.forEach((t) => {
        if (!t.obj) return;
        const ownMeshes = new Set();
        t.obj.traverse((sub) => {
          if (sub.isMesh) {
            ownMeshes.add(sub);
          }
        });
        const collidableMeshes = allSceneMeshes.filter((m) => !ownMeshes.has(m));
        physicsEntities.push({
          obj: t.obj,
          laserLength: t.laserLength,
          isFrikame: t.isFrikame,
          collidableMeshes,
          vy: 0,
          onGround: false,
          settled: false,
          lastGroundY: null
        });
      });
    }

    function filterBroadphase(meshes, rayStart, rayEnd, padding) {
      _rayBox.makeEmpty();
      _rayBox.expandByPoint(rayStart);
      _rayBox.expandByPoint(rayEnd);
      _rayBox.expandByScalar(padding);

      const candidates = [];
      for (let i = 0; i < meshes.length; i++) {
        const m = meshes[i];
        const wb = m.userData.worldBox;
        if (!wb || wb.intersectsBox(_rayBox)) {
          candidates.push(m);
        }
      }
      return candidates;
    }

    function updatePhysics(dt) {
      if (physicsEntities.length === 0) return;

      const gravity = -9.8;
      const walkSpeed = 60.0;
      const jumpSpeed = 27.5;
      const _rayEnd = new THREE.Vector3();

      for (let idx = 0; idx < physicsEntities.length; idx++) {
        const entity = physicsEntities[idx];
        const obj = entity.obj;
        const isControlledFrikame = entity.isFrikame && activeCamera === obj;

        if (!isControlledFrikame && entity.settled && entity.onGround && entity.vy === 0) {
          continue;
        }

        if (isControlledFrikame) {
          _forward.set(0, 0, -1).applyQuaternion(obj.quaternion);
          _forward.y = 0;
          if (_forward.lengthSq() > 0) _forward.normalize();

          _right.set(1, 0, 0).applyQuaternion(obj.quaternion);
          _right.y = 0;
          if (_right.lengthSq() > 0) _right.normalize();

          _moveDir.set(0, 0, 0);
          if (pressedKeys.has('KeyW')) _moveDir.add(_forward);
          if (pressedKeys.has('KeyS')) _moveDir.sub(_forward);
          if (pressedKeys.has('KeyD')) _moveDir.add(_right);
          if (pressedKeys.has('KeyA')) _moveDir.sub(_right);

          if (_moveDir.lengthSq() > 0) {
            _moveDir.normalize();
            _moveStepWorld.copy(_moveDir).multiplyScalar(walkSpeed * dt);
            const stepLen = _moveStepWorld.length();

            obj.updateMatrixWorld(true);
            obj.getWorldPosition(_worldPos);

            let allowedStep = stepLen;
            if (entity.collidableMeshes.length > 0 && stepLen > 0) {
              _horizDir.copy(_moveStepWorld).normalize();
              const bodyRadius = 0.6;
              const checkHeights = [0.5 - entity.laserLength + 0.5, -entity.laserLength * 0.5, 0];
              for (let h = 0; h < checkHeights.length; h++) {
                _rayOrigin.copy(_worldPos);
                _rayOrigin.y += checkHeights[h];
                _rayEnd.copy(_rayOrigin).addScaledVector(_horizDir, stepLen + bodyRadius);
                const candidates = filterBroadphase(entity.collidableMeshes, _rayOrigin, _rayEnd, 1.0);
                if (candidates.length > 0) {
                  raycaster.set(_rayOrigin, _horizDir);
                  raycaster.near = 0;
                  raycaster.far = stepLen + bodyRadius;
                  const hits = raycaster.intersectObjects(candidates, false);
                  if (hits.length > 0) {
                    const safeDist = Math.max(0, hits[0].distance - bodyRadius);
                    if (safeDist < allowedStep) {
                      allowedStep = safeDist;
                    }
                  }
                }
              }
            }

            if (allowedStep > 0) {
              _finalMoveWorld.copy(_moveDir).multiplyScalar(allowedStep);
              if (obj.parent) {
                obj.parent.getWorldScale(_parentScale);
                obj.parent.getWorldQuaternion(_parentQuat).invert();
                _finalMoveWorld.applyQuaternion(_parentQuat);
                obj.position.x += _finalMoveWorld.x / (_parentScale.x || 1);
                obj.position.z += _finalMoveWorld.z / (_parentScale.z || 1);
              } else {
                obj.position.add(_finalMoveWorld);
              }
              entity.settled = false;
            }
          }

          if (pressedKeys.has('Space') && entity.onGround) {
            entity.vy = jumpSpeed;
            entity.onGround = false;
            entity.settled = false;
          }
        }

        if (entity.onGround && entity.vy === 0 && !isControlledFrikame) {
          entity.settled = true;
          continue;
        }

        entity.vy += gravity * dt;
        const dyWorld = entity.vy * dt;

        obj.updateMatrixWorld(true);
        obj.getWorldPosition(_worldPos);

        const rayOffsetUp = 0.5;
        _rayOrigin.copy(_worldPos);
        _rayOrigin.y += rayOffsetUp;

        const maxDist = rayOffsetUp + entity.laserLength + Math.max(0, -dyWorld) + 0.05;
        _rayEnd.copy(_rayOrigin);
        _rayEnd.y -= maxDist;

        let hitY = null;
        if (entity.collidableMeshes.length > 0) {
          const candidates = filterBroadphase(entity.collidableMeshes, _rayOrigin, _rayEnd, 0.5);
          if (candidates.length > 0) {
            raycaster.set(_rayOrigin, downDir);
            raycaster.near = 0;
            raycaster.far = maxDist;
            const intersects = raycaster.intersectObjects(candidates, false);
            if (intersects.length > 0) {
              hitY = intersects[0].point.y;
            }
          }
        }

        const nextWorldY = _worldPos.y + dyWorld;
        const targetFloorWorldY = hitY !== null ? hitY + entity.laserLength : null;

        if (targetFloorWorldY !== null && nextWorldY <= targetFloorWorldY && entity.vy <= 0) {
          const correctionWorldY = targetFloorWorldY - _worldPos.y;
          if (Math.abs(correctionWorldY) > 1e-5) {
            if (obj.parent) {
              obj.parent.getWorldScale(_parentScale);
              obj.position.y += correctionWorldY / (_parentScale.y || 1);
            } else {
              obj.position.y += correctionWorldY;
            }
            obj.updateMatrixWorld(true);
            obj.traverse((sub) => {
              if (sub.isMesh && sub.geometry.boundingBox) {
                sub.userData.worldBox = sub.geometry.boundingBox.clone().applyMatrix4(sub.matrixWorld);
              }
            });
          }
          entity.vy = 0;
          entity.onGround = true;
          if (!isControlledFrikame) {
            entity.settled = true;
          }
        } else {
          if (obj.parent) {
            obj.parent.getWorldScale(_parentScale);
            obj.position.y += dyWorld / (_parentScale.y || 1);
          } else {
            obj.position.y += dyWorld;
          }
          entity.onGround = false;
          entity.settled = false;
        }
      }
    }

    function updateAxleControls(dt) {
      const isControlCamera =
        activeCamera === cameras['射手'] ||
        activeCamera === cameras['車長'] ||
        activeCamera === cameras['操縦手'];

      if (!isControlCamera) return;

      const allAxles = ['右1軸', '右2軸', '右3軸', '右4軸', '左1軸', '左2軸', '左3軸', '左4軸', '左４軸'];
      const rightSteerAxles = ['右1軸', '右2軸'];
      const leftSteerAxles = ['左1軸', '左2軸'];

      let throttle = pressedKeys.has('KeyW');
      let brake = pressedKeys.has('KeyS');

      if (throttle) {
        if (currentGear === 'R') {
          carSpeed = Math.max(-30, carSpeed - 15 * dt);
          engineRpm = Math.min(7500, engineRpm + 3000 * dt);
        } else if (currentGear >= '1' && currentGear <= '8') {
          const gNum = parseInt(currentGear);
          let penalty = 1.0;
          if (gNum > highestGearStarted) {
            penalty = Math.max(0.1, 1.0 - (gNum - highestGearStarted) * 0.25);
          }
          let efficiency = Math.pow(gNum / 8, 1.5) * penalty;
          if (gNum === 8) efficiency = 0.2 * penalty;
          else if (gNum === 1) efficiency = 0.9;

          let targetMax = gNum * 15;
          carSpeed += (targetMax - carSpeed) * dt * 2.0 * efficiency + 5 * dt * efficiency;
          carSpeed = Math.min(120, carSpeed);

          let targetRpm = 800 + (carSpeed / 120) * 6700 + (gNum * 200);
          if (targetRpm >= 7500) {
            engineRpm = 7000 + Math.sin(performance.now() * 0.02) * 500;
          } else {
            engineRpm += (targetRpm - engineRpm) * dt * 5.0;
          }
        } else {
          carSpeed = Math.max(0, carSpeed - 5 * dt);
          engineRpm = Math.min(6000, engineRpm + 4000 * dt);
        }
      } else if (brake) {
        if (carSpeed > 0) {
          carSpeed = Math.max(0, carSpeed - 5 * dt * 3.0);
        } else if (carSpeed < 0) {
          carSpeed = Math.min(0, carSpeed + 5 * dt * 3.0);
        }
        engineRpm = Math.max(800, engineRpm - 3000 * dt);
      } else {
        if (carSpeed > 0) carSpeed = Math.max(0, carSpeed - 3 * dt);
        else if (carSpeed < 0) carSpeed = Math.min(0, carSpeed + 3 * dt);
        engineRpm = Math.max(800, engineRpm - 2000 * dt);
      }

      wheelRotationZ += carSpeed * dt * 0.5;

      if (carSpeed !== 0) {
        for (let i = 0; i < allAxles.length; i++) {
          const bone = getNode(allAxles[i]);
          if (bone) {
            const initZ = initialRotations[allAxles[i]] ? initialRotations[allAxles[i]].z : 0;
            // バックの時の回転方向とアクセルの時の回転方向の符号が逆
            const sign = currentGear === 'R' ? -1 : 1;
            bone.rotation.z = initZ + sign * wheelRotationZ;
          }
        }
      }

      const maxSteerRad = THREE.MathUtils.degToRad(29);
      const steerSpeed = THREE.MathUtils.degToRad(60);
      let steerDir = 0;
      if (pressedKeys.has('KeyA')) steerDir -= 1;
      if (pressedKeys.has('KeyD')) steerDir += 1;

      if (steerDir !== 0) {
        steerAngle = THREE.MathUtils.clamp(steerAngle + steerDir * steerSpeed * dt, -maxSteerRad, maxSteerRad);
      } else {
        if (steerAngle > 0) {
          steerAngle = Math.max(0, steerAngle - steerSpeed * dt);
        } else if (steerAngle < 0) {
          steerAngle = Math.min(0, steerAngle + steerSpeed * dt);
        }
      }

      for (let i = 0; i < rightSteerAxles.length; i++) {
        const name = rightSteerAxles[i];
        const bone = getNode(name);
        if (bone) {
          const initY = initialRotations[name] ? initialRotations[name].y : 0;
          bone.rotation.y = initY + steerAngle;
        }
      }

      for (let i = 0; i < leftSteerAxles.length; i++) {
        const name = leftSteerAxles[i];
        const bone = getNode(name);
        if (bone) {
          const initY = initialRotations[name] ? initialRotations[name].y : 0;
          bone.rotation.y = initY - steerAngle;
        }
      }

      updateManualUI();
    }

    function switchCamera(name) {
      const target = cameras[name];
      if (!target) return;

      target.near = 0.01;
      target.aspect = window.innerWidth / window.innerHeight;
      target.updateProjectionMatrix();
      activeCamera = target;
      camNameEl.textContent = name;

      controls.enabled = false;
      isFreeLook = true;
      freeLookEuler.setFromQuaternion(target.quaternion, 'YXZ');
      updateManualUI();
    }

    function loadGLB(file) {
      const url = URL.createObjectURL(file);
      loader.load(url, (gltf) => {
        if (loadedModel) {
          scene.remove(loadedModel);
        }
        for (const key in cameras) {
          delete cameras[key];
        }
        for (const key in nodes) {
          delete nodes[key];
        }
        for (const key in initialRotations) {
          delete initialRotations[key];
        }
        turretVelocity = 0;
        steerAngle = 0;
        carSpeed = 0;
        engineRpm = 800;
        shiftCol = 2;
        shiftRow = 0;
        currentGear = 'N';
        highestGearStarted = 1;

        loadedModel = gltf.scene;
        scene.add(loadedModel);

        loadedModel.traverse((obj) => {
          if (obj.isMesh) {
            obj.castShadow = true;
            obj.receiveShadow = true;
            obj.frustumCulled = true;
            if (obj.material) {
              obj.material.envMapIntensity = 1.0;
            }
          }
          if (obj.name) {
            nodes[obj.name] = obj;
            initialRotations[obj.name] = obj.rotation.clone();
          }
          if (obj.isCamera && obj.name) {
            obj.near = 0.01;
            obj.updateProjectionMatrix();
            cameras[obj.name] = obj;
          }
        });

        if (gltf.cameras) {
          gltf.cameras.forEach((cam) => {
            cam.near = 0.01;
            cam.updateProjectionMatrix();
            if (cam.name && !cameras[cam.name]) {
              cameras[cam.name] = cam;
            }
          });
        }

        setupPhysics();
        renderer.shadowMap.needsUpdate = true;

        seatIndex = 0;
        group2Index = 0;
        if (cameras['射手']) {
          switchCamera('射手');
        } else if (cameras['車長']) {
          switchCamera('車長');
        } else if (cameras['操縦手']) {
          switchCamera('操縦手');
        } else if (cameras['フリカメ']) {
          switchCamera('フリカメ');
        } else {
          activeCamera = defaultCamera;
          defaultCamera.near = 0.01;
          defaultCamera.updateProjectionMatrix();
          controls.object = defaultCamera;
          controls.enabled = true;
          isFreeLook = false;
          camNameEl.textContent = 'デフォルト';
        }

        updateManualUI();
        URL.revokeObjectURL(url);
      });
    }

    document.getElementById('fileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (file) loadGLB(file);
    });

    renderer.domElement.addEventListener('pointerdown', (e) => {
      if (!isFreeLook) return;
      isDragging = true;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;
    });

    window.addEventListener('pointermove', (e) => {
      if (!isFreeLook || !isDragging) return;
      const dx = e.clientX - prevMouseX;
      const dy = e.clientY - prevMouseY;
      prevMouseX = e.clientX;
      prevMouseY = e.clientY;

      const sensitivity = 0.003;
      freeLookEuler.y -= dx * sensitivity;
      freeLookEuler.x -= dy * sensitivity;
      freeLookEuler.x = Math.max(-Math.PI / 2 + 0.01, Math.min(Math.PI / 2 - 0.01, freeLookEuler.x));
      activeCamera.quaternion.setFromEuler(freeLookEuler);
    });

    window.addEventListener('pointerup', () => {
      isDragging = false;
    });

    window.addEventListener('keydown', (e) => {
      pressedKeys.add(e.code);
      if (e.repeat) return;

      const isControlCamera =
        activeCamera === cameras['射手'] ||
        activeCamera === cameras['車長'] ||
        activeCamera === cameras['操縦手'];

      if (isControlCamera) {
        if (e.code === 'KeyH') {
          if (shiftRow === 0 && shiftCol > 0) {
            shiftCol--;
            updateGearFromPosition();
            updateManualUI();
          }
        } else if (e.code === 'KeyK') {
          if (shiftRow === 0 && shiftCol < 4) {
            shiftCol++;
            updateGearFromPosition();
            updateManualUI();
          }
        } else if (e.code === 'KeyU') {
          if (shiftRow === 1) {
            shiftRow = 0;
            updateGearFromPosition();
            updateManualUI();
          } else if (shiftRow === 0 && shiftCol >= 1 && shiftCol <= 4) {
            shiftRow = -1;
            updateGearFromPosition();
            updateManualUI();
          }
        } else if (e.code === 'KeyJ') {
          if (shiftRow === -1) {
            shiftRow = 0;
            updateGearFromPosition();
            updateManualUI();
          } else if (shiftRow === 0 && shiftCol >= 0 && shiftCol <= 4) {
            shiftRow = 1;
            updateGearFromPosition();
            updateManualUI();
          }
        }
      }

      if (e.key === '1' || e.code === 'Digit1') {
        for (let i = 0; i < seatNames.length; i++) {
          const targetName = seatNames[seatIndex];
          seatIndex = (seatIndex + 1) % seatNames.length;
          if (cameras[targetName]) {
            switchCamera(targetName);
            break;
          }
        }
      } else if (e.key === '2' || e.code === 'Digit2') {
        for (let i = 0; i < group2Names.length; i++) {
          const targetName = group2Names[group2Index];
          group2Index = (group2Index + 1) % group2Names.length;
          if (cameras[targetName]) {
            switchCamera(targetName);
            break;
          }
        }
      } else if (e.key === '¥' || e.key === '\\' || e.code === 'IntlYen' || e.code === 'Backslash') {
        switchCamera('フリカメ');
      }
    });

    window.addEventListener('keyup', (e) => {
      pressedKeys.delete(e.code);
    });

    window.addEventListener('blur', () => {
      pressedKeys.clear();
    });

    window.addEventListener('resize', () => {
      activeCamera.aspect = window.innerWidth / window.innerHeight;
      activeCamera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.05);

      updatePhysics(dt);
      updateAxleControls(dt);

      const turret = getNode('銃座');
      if (turret) {
        let inputDir = 0;
        if (pressedKeys.has('KeyQ')) inputDir += 1;
        if (pressedKeys.has('KeyE')) inputDir -= 1;

        if (inputDir !== 0 || Math.abs(turretVelocity) > 1e-5) {
          const acceleration = 5.0;
          const damping = 3.0;

          turretVelocity += inputDir * acceleration * dt;
          turretVelocity -= turretVelocity * damping * dt;
          turret.rotation.y += turretVelocity * dt;
        } else {
          turretVelocity = 0;
        }
      }

      if (controls.enabled) {
        controls.update();
      }
      renderer.render(scene, activeCamera);
    }
    animate();
  </script>
</body>
</html>
